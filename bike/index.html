<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikevia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --fg: #111;
      --bg: #fff;
      --muted: #777;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f5f5f5;
        --bg: #111;
        --muted: #888;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      font-size: 18px;
      color: var(--muted);
    }
    .download {
      margin-top: 24px;
      padding: 14px 28px;
      border: 1.5px solid var(--fg);
      border-radius: 999px;
      color: var(--fg);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .download:hover,
    .download:focus-visible {
      background: var(--fg);
      color: var(--bg);
      outline: none;
    }
    footer {
      position: fixed;
      bottom: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    footer a {
      color: inherit;
      text-decoration: none;
    }
    footer a:hover,
    footer a:focus-visible {
      color: var(--fg);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Bikevia</h1>
  <!-- TODO: 앱 한 줄 소개 -->
  <p>당신이 원하던 심플한 자전거 속도계 앱.</p>
  <!-- TODO: href에 플레이스토어 링크 넣기 -->
  <a class="download" href="#">Google Play에서 다운로드</a>
  <footer>© 2026 Bikevia · <a href="/bike/privacy/">개인정보 처리방침</a></footer>
</body>
</html>
